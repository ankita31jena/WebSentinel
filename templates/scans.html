{% extends "base.html" %}
{% block content %}
<h4 class="fw-bold mb-4">📡 Scan History</h4>
<div class="card-stat">
  <table class="table table-dark-custom table-hover mb-0">
    <thead>
      <tr><th>Scan ID</th><th>Target URL</th><th>URLs Found</th><th>Timestamp</th><th>Status</th></tr>
    </thead>
    <tbody>
      {% for s in scans %}
      <tr>
        <td><code>{{ s.scan_id }}</code></td>
        <td>{{ s.target }}</td>
        <td>{{ s.urls_found }}</td>
        <td>{{ s.timestamp }}</td>
        <td><span class="badge bg-success">{{ s.status }}</span></td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
